<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 700 17px Arial, sans-serif; fill: #1e293b; }
      .box { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .boxbg { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="840" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">System Architecture</text>

  <rect x="30" y="75" width="390" height="650" class="group"/>
  <text x="225" y="115" text-anchor="middle" class="sub">Simulation Layer</text>
  <rect x="70" y="145" width="310" height="75" class="boxbg"/><text x="225" y="176" text-anchor="middle" class="box">ns-3 Wireless Simulation</text><text x="225" y="198" text-anchor="middle" class="small">1 AP + 2 stations</text>
  <rect x="70" y="255" width="310" height="75" class="boxbg"/><text x="225" y="286" text-anchor="middle" class="box">Traffic and Scenario Workloads</text><text x="225" y="308" text-anchor="middle" class="small">UDP flows | 1200-byte packets</text>
  <rect x="70" y="365" width="310" height="75" class="boxbg"/><text x="225" y="396" text-anchor="middle" class="box">IEEE 802.11 MAC Layer</text><text x="225" y="418" text-anchor="middle" class="small">AC_BE Txop and CW limits</text>
  <rect x="70" y="475" width="310" height="50" class="boxbg"/><text x="225" y="506" text-anchor="middle" class="box">Conventional DCF</text>
  <rect x="70" y="545" width="310" height="50" class="boxbg"/><text x="225" y="576" text-anchor="middle" class="box">Enhanced DCF / EDCA</text>
  <rect x="70" y="615" width="310" height="50" class="boxbg"/><text x="225" y="646" text-anchor="middle" class="box">RL Adaptive DCF</text>

  <path d="M225,220 V255" class="line"/><path d="M225,330 V365" class="line"/>
  <path d="M225,440 V475" class="line"/><path d="M225,525 V545" class="line"/><path d="M225,595 V615" class="line"/>

  <rect x="450" y="75" width="390" height="650" class="group"/>
  <text x="645" y="115" text-anchor="middle" class="sub">Communication Layer</text>
  <rect x="490" y="145" width="310" height="75" class="boxbg"/><text x="645" y="176" text-anchor="middle" class="box">ns3-ai Gym Interface</text><text x="645" y="198" text-anchor="middle" class="small">Ns3-v0 | reset() / step()</text>
  <rect x="490" y="255" width="310" height="75" class="boxbg"/><text x="645" y="286" text-anchor="middle" class="box">8-value Observation</text><text x="645" y="308" text-anchor="middle" class="small">queues, growth, loss, MAC, CW, latency</text>
  <rect x="490" y="365" width="310" height="75" class="boxbg"/><text x="645" y="396" text-anchor="middle" class="box">Action Value</text><text x="645" y="418" text-anchor="middle" class="small">0 decrease | 1 keep | 2 increase</text>
  <rect x="490" y="475" width="310" height="75" class="boxbg"/><text x="645" y="506" text-anchor="middle" class="box">Interval Reward</text><text x="645" y="528" text-anchor="middle" class="small">throughput, loss, latency, queue, retry</text>
  <rect x="490" y="615" width="310" height="50" class="boxbg"/><text x="645" y="646" text-anchor="middle" class="box">100 ms Decision Interval</text>

  <path d="M380,640 H490" class="line"/><path d="M645,665 V550" class="line"/>
  <path d="M645,475 V440" class="line"/><path d="M645,365 V330" class="line"/><path d="M645,255 V220" class="line"/>

  <rect x="870" y="75" width="500" height="650" class="group"/>
  <text x="1120" y="115" text-anchor="middle" class="sub">Python Reinforcement Learning</text>
  <rect x="910" y="145" width="420" height="75" class="boxbg"/><text x="1120" y="176" text-anchor="middle" class="box">State Encoder</text><text x="1120" y="198" text-anchor="middle" class="small">q_table_v2 state discretization</text>
  <rect x="910" y="255" width="420" height="75" class="boxbg"/><text x="1120" y="286" text-anchor="middle" class="box">Tabular Q-learning Agent</text><text x="1120" y="308" text-anchor="middle" class="small">greedy action selection; keep on ties</text>
  <rect x="910" y="365" width="420" height="75" class="boxbg"/><text x="1120" y="396" text-anchor="middle" class="box">Q-table</text><text x="1120" y="418" text-anchor="middle" class="small">q_table_v2.json | completed checkpoint</text>
  <rect x="910" y="475" width="420" height="75" class="boxbg"/><text x="1120" y="506" text-anchor="middle" class="box">CW Action Selection</text><text x="1120" y="528" text-anchor="middle" class="small">nearest valid CW: 7, 15, 31, 63, 127</text>

  <path d="M800,292 H910" class="line"/><path d="M1120,220 V255" class="line"/>
  <path d="M1120,330 V365" class="dash"/><path d="M1120,440 V475" class="line"/>
  <path d="M910,512 H800" class="line"/>

  <rect x="870" y="755" width="500" height="55" class="boxbg"/>
  <text x="1120" y="788" text-anchor="middle" class="box">Evaluation: throughput, packet loss, latency, queues, CW</text>
  <path d="M380,680 C600,760 830,780 870,782" class="dash"/>

  <rect x="450" y="755" width="390" height="55" class="boxbg"/>
  <text x="645" y="788" text-anchor="middle" class="box">Comparison: DCF | EDCA | RL Adaptive DCF</text>
  <path d="M870,782 H840" class="dash"/>
</svg>
